spring:
  application:
    name: product-finder
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
  mongodb:
    uri: ${SPRING_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/product_finder}}
  data:
    mongodb:
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:false}

# Set these in the deployment environment. The issuer must include the realm, for example:
# https://keycloak.example.com/realms/product-finder
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  # Use this only when the issuer URL is not reachable from the backend, such as Docker Compose development.
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  client-id: ${KEYCLOAK_CLIENT_ID:}
  redirect-uri: ${KEYCLOAK_REDIRECT_URI:}

product-finder:
  connect-timeout: 2s
  read-timeout: 5s
  # Midnight UTC. Override with PRODUCT_CACHE_REFRESH_CRON and PRODUCT_CACHE_REFRESH_ZONE when needed.
  cache-refresh-cron: ${PRODUCT_CACHE_REFRESH_CRON:0 0 0 * * *}
  cache-refresh-zone: ${PRODUCT_CACHE_REFRESH_ZONE:UTC}
  full-refresh-limit: ${PRODUCT_FULL_REFRESH_LIMIT:10000}
  catalogs:
    newegg:
      enabled: ${NEWEGG_ENABLED:false}
      base-url: ${NEWEGG_BASE_URL:}
      api-key: ${NEWEGG_API_KEY:}
    bh-photo-video:
      enabled: ${BH_PHOTO_VIDEO_ENABLED:false}
      base-url: ${BH_PHOTO_VIDEO_BASE_URL:}
      api-key: ${BH_PHOTO_VIDEO_API_KEY:}
    abt:
      enabled: ${ABT_ENABLED:false}
      base-url: ${ABT_BASE_URL:}
      api-key: ${ABT_API_KEY:}
