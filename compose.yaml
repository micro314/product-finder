services:
  backend:
    build:
      context: ./backend
    image: product-finder-backend:local
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/product-finder
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/product-finder/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: product-finder-web
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_finder
      SPRING_DATASOURCE_USERNAME: product_finder
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-product-finder}
      JPA_DDL_AUTO: update
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./keycloak/product-finder-realm.json:/opt/keycloak/data/import/product-finder-realm.json:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_finder
      POSTGRES_USER: product_finder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product-finder}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_finder -d product_finder"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - product-finder-postgres:/var/lib/postgresql/data

volumes:
  product-finder-postgres:
