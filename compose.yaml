services:
  backend:
    build:
      context: ./backend
    image: product-finder-backend:local
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/product-finder
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/product-finder/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: product-finder-web
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:3000/auth/callback}
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./keycloak/product-finder-realm.json:/opt/keycloak/data/import/product-finder-realm.json:ro
